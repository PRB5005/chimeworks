name: Build, Test & Deploy ChimeWorks

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Compile wasm/physics.rs to src/physics.wasm
        run: |
          rustc --edition=2021 \
            --target wasm32-unknown-unknown \
            --crate-type=cdylib \
            -O \
            wasm/physics.rs \
            -o src/physics.wasm
          ls -lh src/physics.wasm

      - name: Vendor lame.min.js
        run: |
          mkdir -p vendor
          curl -fsSL https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js -o vendor/lame.min.js
          ls -lh vendor/lame.min.js

      - name: Run headless Node.js WASM determinism test
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Execute determinism verification
        run: |
          node -e '
          const fs = require("fs");
          const bytes = fs.readFileSync("src/physics.wasm");
          (async () => {
            const runOnce = async () => {
              const { instance } = await WebAssembly.instantiate(bytes, {});
              const w = instance.exports;
              w.clear_config();
              const em = new Float32Array(w.memory.buffer, w.get_emitters_ptr(), 48);
              const pa = new Float32Array(w.memory.buffer, w.get_parts_ptr(), 32 * 9);
              // Layer 0 emitter + ramp + bell
              em.set([1, 0, 28, 18, 1.88, 48, 30, 0], 0);
              pa.set([1, 0, 0, 44, 68, 0.42, 22, 0, 0], 0);
              pa.set([1, 3, 0, 74, 106, 0, 10, 4, 0], 9);
              const evCount = w.rollout(240, 4);
              const sum = w.checksum() >>> 0;
              return { evCount, sum };
            };
            const a = await runOnce();
            const b = await runOnce();
            console.log("Determinism check:", a, b);
            if (a.evCount === 0) throw new Error("Expected >0 physics events");
            if (a.evCount !== b.evCount || a.sum !== b.sum) {
              throw new Error("Non-deterministic WASM rollout detected");
            }
            console.log("PASS: Bit-exact WASM determinism verified.");
          })().catch((e) => { console.error(e); process.exit(1); });
          '

      - name: Bundle static site artifact
        run: |
          mkdir -p _site/vendor
          cp -r src/* _site/
          cp vendor/lame.min.js _site/vendor/lame.min.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4